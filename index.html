<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi - UFO Kebonsari</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6C63FF">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ========================================
           ROOT VARIABLES - DARK MODE (DEFAULT)
        ======================================== */
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-light: #8B83FF;
            --primary-gradient: linear-gradient(135deg, #6C63FF 0%, #3F3D9E 100%);
            --primary-glow: 0 8px 32px rgba(108, 99, 255, 0.35);
            
            --secondary: #FF6B6B;
            --success: #00D2D3;
            --warning: #FECA57;
            
            --bg-body: #0A0A1A;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            
            --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.3);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           LIGHT MODE
        ======================================== */
        [data-theme="light"] {
            --bg-body: #F1F5F9;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-card-hover: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            
            --text-primary: #0F172A;
            --text-secondary: rgba(15, 23, 42, 0.7);
            --text-muted: rgba(15, 23, 42, 0.4);
            
            --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.06);
        }

        [data-theme="light"] body {
            background: #F1F5F9;
        }

        [data-theme="light"] .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        /* ========================================
           RESET & BASE
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg-body);
            transition: var(--transition);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        [data-theme="light"] body::before {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
        }

        /* ========================================
           GLASS CARD
        ======================================== */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft);
            position: relative;
            z-index: 1;
            transition: var(--transition);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] .glass-card:hover {
            border-color: rgba(0, 0, 0, 0.12);
        }

        /* ========================================
           BOX / CARD CONTAINER
        ======================================== */
        .box {
            width: 100%;
            max-width: 440px;
            padding: 32px 24px;
            position: relative;
            z-index: 1;
        }

        /* ========================================
           THEME TOGGLE
        ======================================== */
        .theme-toggle-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 6px 8px;
            display: flex;
            gap: 4px;
            transition: var(--transition);
        }

        .theme-toggle .toggle-btn {
            padding: 6px 14px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle .toggle-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--primary-glow);
        }

        .theme-toggle .toggle-btn i {
            margin-right: 4px;
        }

        /* ========================================
           LOGO
        ======================================== */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            padding: 5px;
            background: var(--primary-gradient);
            box-shadow: var(--primary-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .logo-container:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 0 60px rgba(108, 99, 255, 0.4);
        }

        .logo-toko {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #0A0A1A;
            padding: 4px;
        }

        [data-theme="light"] .logo-toko {
            background: #FFFFFF;
        }

        /* ========================================
           TYPOGRAPHY
        ======================================== */
        .title {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
            margin-top: 2px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .subtitle i {
            color: var(--primary-light);
            margin-right: 4px;
        }

        /* ========================================
           TIME WRAPPER
        ======================================== */
        .time-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px 14px;
            margin-bottom: 16px;
            text-align: center;
        }

        .jam-digital {
            font-size: 40px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }

        .tanggal-digital {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
            text-transform: capitalize;
        }

        /* ========================================
           STAT BOX
        ======================================== */
        .stat-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .stat-item:hover {
            background: var(--bg-card-hover);
        }

        .stat-item .label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-item .label i {
            font-size: 13px;
        }

        .stat-item .value {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .stat-item .value.success { color: var(--success); }
        .stat-item .value.danger { color: var(--secondary); }
        .stat-item .value.warning { color: var(--warning); }

        /* ========================================
           STATUS LOG
        ======================================== */
        #status-log {
            font-size: 12px !important;
            color: var(--text-secondary) !important;
            background: var(--bg-card) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: var(--radius-sm) !important;
            padding: 14px !important;
            margin-bottom: 14px !important;
            font-weight: 500 !important;
            text-align: center !important;
            line-height: 1.6 !important;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========================================
           GPS SECTION
        ======================================== */
        .gps-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .gps-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .gps-status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .gps-status-badge .dot.on {
            background: var(--success);
            box-shadow: 0 0 12px rgba(0, 210, 211, 0.4);
        }

        .gps-status-badge .dot.off {
            background: var(--secondary);
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
        }

        .gps-status-badge .dot.loading {
            background: var(--warning);
            box-shadow: 0 0 12px rgba(254, 202, 87, 0.4);
            animation: pulse-loading 0.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        @keyframes pulse-loading {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.6); }
        }

        #btn-refresh-gps {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        #btn-refresh-gps:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        #btn-refresh-gps:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========================================
           TOMBOL ABSEN
        ======================================== */
        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .absen-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .absen-card {
            border-radius: var(--radius-md);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .absen-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .absen-card:active { transform: scale(0.95); }

        .absen-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            transition: var(--transition);
        }

        .absen-card:hover .absen-icon {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        .absen-title {
            font-size: 13px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.3px;
        }

        .info-jam-absen {
            font-size: 11px;
            font-weight: 600;
            min-height: 20px;
            display: block;
            text-align: center;
            padding: 2px 12px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Check In */
        .card-in {
            background: linear-gradient(145deg, #6C63FF 0%, #4F46E5 50%, #3B32A8 100%) !important;
            box-shadow: 0 6px 24px rgba(108, 99, 255, 0.35);
        }

        .card-in:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.5);
        }

        /* Check Out */
        .card-out {
            background: linear-gradient(145deg, #FF6B6B 0%, #EE5A24 50%, #C0392B 100%) !important;
            box-shadow: 0 6px 24px rgba(255, 107, 107, 0.35);
        }

        .card-out:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.5);
        }

        /* OFF */
        .card-off-wrapper {
            display: flex;
            justify-content: center;
        }

        .card-off {
            background: linear-gradient(145deg, #EF4444 0%, #DC2626 50%, #B91C1C 100%) !important;
            box-shadow: 0 6px 24px rgba(239, 68, 68, 0.35);
            flex-direction: row !important;
            gap: 10px !important;
            padding: 12px 24px !important;
            min-width: 200px !important;
            width: auto !important;
        }

        .card-off:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 40px rgba(239, 68, 68, 0.5);
        }

        .card-off .absen-icon {
            width: 36px;
            height: 36px;
            font-size: 16px;
        }

        .card-off .info-jam-absen {
            color: #FCA5A5;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Disabled */
        .btn-disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            filter: grayscale(0.4) brightness(0.7) !important;
            transform: scale(0.98) !important;
        }

        .btn-disabled::after {
            display: none !important;
        }

        /* ========================================
           INPUT
        ======================================== */
        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group label i {
            margin-right: 4px;
            color: var(--primary-light);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: var(--transition);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card-hover);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        /* ========================================
           BUTTONS
        ======================================== */
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4);
        }

        .btn-logout {
            background: linear-gradient(135deg, #00B894 0%, #00A381 100%);
            color: white;
            font-size: 13px;
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 184, 148, 0.3);
            margin-top: 4px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 184, 148, 0.4);
        }

        /* ========================================
           SPINNER
        ======================================== */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #FFFFFF;
            width: 18px;
            height: 18px;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================
           MODAL
        ======================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 28px 24px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 340px;
            text-align: center;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-box h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 10px 0 16px;
            line-height: 1.6;
        }

        .modal-box .btn-modal {
            background: var(--primary-gradient);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }

        .modal-box .btn-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4);
        }

        /* ========================================
           PERIODE TEXT
        ======================================== */
        #periode-karyawan-text {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 14px;
            text-align: center;
            display: none;
        }

        #periode-karyawan-text strong {
            color: var(--primary-light);
            font-size: 13px;
            font-weight: 800;
            display: block;
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 480px) {
            .box { padding: 20px 14px; }
            .logo-container { width: 64px; height: 64px; }
            .title { font-size: 20px; }
            .jam-digital { font-size: 32px; }
            .stat-box { grid-template-columns: 1fr; gap: 6px; }
            .stat-item { padding: 10px 12px; }
            .stat-item .value { font-size: 14px; }
            .absen-card { padding: 14px 10px; }
            .absen-icon { width: 38px; height: 38px; font-size: 16px; }
            .card-off { min-width: 160px; padding: 10px 18px !important; }
            .gps-section { gap: 8px; }
            .theme-toggle .toggle-btn { padding: 4px 10px; font-size: 10px; }
        }
    </style>
</head>
<body>

<!-- ========================================================== -->
<!-- ====================== VIEW LOGIN ======================== -->
<!-- ========================================================== -->
<div id="view-login" class="glass-card box">
    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper">
        <div class="theme-toggle" id="themeToggle">
            <button class="toggle-btn active" data-theme="dark" onclick="setTheme('dark')">
                <i class="fas fa-moon"></i> Gelap
            </button>
            <button class="toggle-btn" data-theme="light" onclick="setTheme('light')">
                <i class="fas fa-sun"></i> Terang
            </button>
        </div>
    </div>

    <div class="logo-wrapper">
        <div class="logo-container">
            <img src="logo.png" class="logo-toko" alt="Logo UFO" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%236C63FF%22/%3E%3Ctext x=%2240%22 y=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2232%22 font-family=%22Inter%22 font-weight=%22900%22%3EUFO%3C/text%3E%3C/svg%3E'">
        </div>
    </div>
    <h1 class="title">UFO KEBONSARI</h1>
    <div class="subtitle"><i class="fas fa-fingerprint"></i> Sistem Absensi Digital</div>

    <div class="input-group">
        <label for="user"><i class="fas fa-user"></i> Username</label>
        <input type="text" id="user" placeholder="Masukkan username">
    </div>

    <div class="input-group">
        <label for="pass"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="pass" placeholder="••••••••">
    </div>

    <button class="btn-primary" id="btn-login" onclick="prosesLogin()">
        <span id="text-login"><i class="fas fa-arrow-right-to-bracket"></i> MASUK</span>
        <div class="spinner" id="login-spinner"></div>
    </button>
</div>

<!-- ========================================================== -->
<!-- ==================== VIEW DASHBOARD ====================== -->
<!-- ========================================================== -->
<div id="view-dashboard" class="glass-card box" style="display:none;">
    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper">
        <div class="theme-toggle" id="themeToggle2">
            <button class="toggle-btn active" data-theme="dark" onclick="setTheme('dark')">
                <i class="fas fa-moon"></i> Gelap
            </button>
            <button class="toggle-btn" data-theme="light" onclick="setTheme('light')">
                <i class="fas fa-sun"></i> Terang
            </button>
        </div>
    </div>

    <div class="logo-wrapper">
        <div class="logo-container" style="width:68px; height:68px;">
            <img src="logo.png" class="logo-toko" alt="Logo UFO" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%236C63FF%22/%3E%3Ctext x=%2240%22 y=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2232%22 font-family=%22Inter%22 font-weight=%22900%22%3EUFO%3C/text%3E%3C/svg%3E'">
        </div>
    </div>
    <h1 class="title" style="font-size:18px;">Halo, <span id="nama-user" style="color:var(--primary-light);"></span>!</h1>
    <div class="subtitle"><i class="fas fa-sparkles"></i> Selamat Bekerja & Tetap Semangat</div>

    <div class="time-wrapper">
        <div class="jam-digital" id="live-jam">00:00:00</div>
        <div class="tanggal-digital" id="live-tanggal">Mencari Tanggal...</div>
    </div>

    <div id="periode-karyawan-text">
        <span style="color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:2px;"><i class="fas fa-calendar"></i> Periode Absensi</span>
        <strong id="periodeText">-</strong>
    </div>

    <div class="stat-box">
        <div class="stat-item">
            <span class="label"><i class="fas fa-check-circle" style="color:var(--success);"></i> Hadir</span>
            <span class="value success" id="total-masuk">0 hari</span>
        </div>
        <div class="stat-item">
            <span class="label"><i class="fas fa-calendar-xmark" style="color:var(--secondary);"></i> OFF</span>
            <span class="value danger" id="total-off">0 hari</span>
        </div>
        <div class="stat-item">
            <span class="label"><i class="fas fa-clock" style="color:var(--warning);"></i> PS</span>
            <span class="value warning" id="total-ps">0 hari</span>
        </div>
        <div class="stat-item">
            <span class="label"><i class="fas fa-triangle-exclamation" style="color:var(--secondary);"></i> Terlambat</span>
            <span class="value danger" id="total-terlambat">0 hari</span>
        </div>
    </div>

    <div id="status-log">
        <i class="fas fa-info-circle"></i> Siap melakukan absensi...
    </div>

    <!-- GPS Section -->
    <div class="gps-section">
        <span class="gps-status-badge" id="gps-badge">
            <span class="dot loading" id="gps-dot"></span>
            <span id="gps-text">Mengambil lokasi...</span>
        </span>
        <button id="btn-refresh-gps" onclick="refreshGPS()">
            <i class="fas fa-satellite-dish"></i> Refresh
        </button>
    </div>

    <!-- Tombol Absensi -->
    <div class="btn-grid">
        <div class="absen-row">
            <button class="absen-card card-in" id="btn-masuk" onclick="absenMasuk()">
                <div class="absen-icon"><i class="fas fa-arrow-right-to-bracket"></i></div>
                <span class="absen-title">CHECK IN</span>
                <span class="info-jam-absen" id="jam-masuk">-</span>
            </button>
            <button class="absen-card card-out" id="btn-keluar" onclick="absenKeluar()">
                <div class="absen-icon"><i class="fas fa-arrow-right-from-bracket"></i></div>
                <span class="absen-title">CHECK OUT</span>
                <span class="info-jam-absen" id="jam-keluar">-</span>
            </button>
        </div>
        <div class="card-off-wrapper">
            <button class="absen-card card-off" id="btn-off" onclick="absenOff()">
                <div class="absen-icon"><i class="fas fa-power-off"></i></div>
                <span class="absen-title">AMBIL OFF</span>
                <span class="info-jam-absen" id="jam-off">-</span>
            </button>
        </div>
    </div>

    <!-- Tombol Logout -->
    <button class="btn-logout" onclick="logout()">
        <i class="fas fa-right-from-bracket"></i> KELUAR
    </button>
</div>

<!-- ========================================================== -->
<!-- ======================== MODAL =========================== -->
<!-- ========================================================== -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-title">Sukses!</h3>
        <p id="modal-message">Absensi berhasil dicatat.</p>
        <button class="btn-modal" onclick="tutupModal()" id="modal-btn">
            <i class="fas fa-check"></i> OK
        </button>
    </div>
</div>

<!-- ========================================================== -->
<!-- ======================== SCRIPT ========================== -->
<!-- ========================================================== -->
<script>
    // ========================================
    // THEME
    // ========================================
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelectorAll('.theme-toggle .toggle-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === theme);
        });
        localStorage.setItem('theme', theme);
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);

    // ========================================
    // STATE
    // ========================================
    let currentUser = null;
    let currentLocation = null;
    let absenData = [];

    // ========================================
    // CLOCK
    // ========================================
    function updateClock() {
        const now = new Date();
        const jam = now.toTimeString().split(' ')[0];
        document.getElementById('live-jam').textContent = jam;

        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const tanggal = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        document.getElementById('live-tanggal').textContent = tanggal;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ========================================
    // PERIODE
    // ========================================
    function updatePeriode() {
        const now = new Date();
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        let bulanMulai, tahunMulai, bulanSelesai, tahunSelesai;
        
        if (now.getDate() >= 26) {
            bulanMulai = months[now.getMonth()];
            tahunMulai = now.getFullYear();
            let next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            bulanSelesai = months[next.getMonth()];
            tahunSelesai = next.getFullYear();
        } else {
            let prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            bulanMulai = months[prev.getMonth()];
            tahunMulai = prev.getFullYear();
            bulanSelesai = months[now.getMonth()];
            tahunSelesai = now.getFullYear();
        }
        
        document.getElementById('periodeText').textContent = `26 ${bulanMulai} ${tahunMulai} - 25 ${bulanSelesai} ${tahunSelesai}`;
        document.getElementById('periode-karyawan-text').style.display = 'block';
    }
    updatePeriode();

    // ========================================
    // GPS
    // ========================================
    function getLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject('GPS tidak didukung browser ini.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                (err) => {
                    reject(`Gagal ambil lokasi: ${err.message}`);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        });
    }

    function updateGPSStatus(status, text) {
        const dot = document.getElementById('gps-dot');
        const badge = document.getElementById('gps-text');
        dot.className = 'dot';
        if (status === 'on') {
            dot.classList.add('on');
            badge.textContent = text || 'GPS Aktif ✓';
        } else if (status === 'off') {
            dot.classList.add('off');
            badge.textContent = text || 'GPS Tidak Aktif ✗';
        } else {
            dot.classList.add('loading');
            badge.textContent = text || 'Mengambil lokasi...';
        }
    }

    async function refreshGPS() {
        const btn = document.getElementById('btn-refresh-gps');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memuat...';
        updateGPSStatus('loading', 'Mencari sinyal...');

        try {
            currentLocation = await getLocation();
            updateGPSStatus('on', `GPS Aktif ✓`);
            document.getElementById('status-log').innerHTML = `<i class="fas fa-check-circle" style="color:var(--success);"></i> Lokasi berhasil diambil.`;
        } catch (err) {
            currentLocation = null;
            updateGPSStatus('off', 'GPS Error');
            document.getElementById('status-log').innerHTML = `<i class="fas fa-exclamation-triangle" style="color:var(--secondary);"></i> ${err}`;
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-satellite-dish"></i> Refresh';
    }

    setTimeout(refreshGPS, 1000);

    // ========================================
    // LOGIN
    // ========================================
    const USER_CREDENTIALS = {
        'admin': 'admin123',
        'karyawan': '123456',
        'yoga': 'yoga123',
        'doni': 'doni123'
    };

    function prosesLogin() {
        const user = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value.trim();

        if (!user || !pass) {
            tampilModal('Peringatan', 'Username dan password wajib diisi!');
            return;
        }

        if (USER_CREDENTIALS[user] && USER_CREDENTIALS[user] === pass) {
            currentUser = user;
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-dashboard').style.display = 'block';
            document.getElementById('nama-user').textContent = user.charAt(0).toUpperCase() + user.slice(1);
            document.getElementById('status-log').innerHTML = `<i class="fas fa-check-circle" style="color:var(--success);"></i> Selamat datang, ${user}!`;
            loadAbsensi();
            return;
        }

        tampilModal('Login Gagal', 'Username atau password salah. Silakan coba lagi.');
    }

    document.getElementById('pass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') prosesLogin();
    });
    document.getElementById('user').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('pass').focus();
    });

    // ========================================
    // LOGOUT - KEMBALI KE LOGIN
    // ========================================
    function logout() {
        currentUser = null;
        document.getElementById('view-dashboard').style.display = 'none';
        document.getElementById('view-login').style.display = 'block';
        document.getElementById('user').value = '';
        document.getElementById('pass').value = '';
        document.getElementById('status-log').innerHTML = '<i class="fas fa-info-circle"></i> Siap melakukan absensi...';
    }

    // ========================================
    // MODAL
    // ========================================
    function tampilModal(title, message) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;
        document.getElementById('modal-overlay').classList.add('show');
    }

    function tutupModal() {
        document.getElementById('modal-overlay').classList.remove('show');
    }

    // ========================================
    // DATA ABSENSI (LocalStorage)
    // ========================================
    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function getNowTime() {
        return new Date().toTimeString().split(' ')[0];
    }

    function loadAbsensi() {
        const stored = localStorage.getItem(`absen_${currentUser}`);
        absenData = stored ? JSON.parse(stored) : [];
        updateStats();
        updateButtonStates();
    }

    function saveAbsensi() {
        localStorage.setItem(`absen_${currentUser}`, JSON.stringify(absenData));
        updateStats();
        updateButtonStates();
    }

    function updateStats() {
        const today = getToday();
        const todayData = absenData.filter(a => a.tanggal === today);

        let hadir = 0, off = 0, ps = 0, terlambat = 0;

        absenData.forEach(a => {
            if (a.status === 'masuk') hadir++;
            else if (a.status === 'off') off++;
            else if (a.status === 'ps') ps++;
            if (a.status === 'masuk' && a.isLate) terlambat++;
        });

        const todayMasuk = todayData.find(a => a.status === 'masuk');
        const todayKeluar = todayData.find(a => a.status === 'keluar');
        const todayOff = todayData.find(a => a.status === 'off' || a.status === 'ps');

        document.getElementById('jam-masuk').textContent = todayMasuk ? todayMasuk.jam : '-';
        document.getElementById('jam-keluar').textContent = todayKeluar ? todayKeluar.jam : '-';
        document.getElementById('jam-off').textContent = todayOff ? todayOff.jam : '-';

        document.getElementById('total-masuk').textContent = `${hadir} hari`;
        document.getElementById('total-off').textContent = `${off} hari`;
        document.getElementById('total-ps').textContent = `${ps} hari`;
        document.getElementById('total-terlambat').textContent = `${terlambat} hari`;
    }

    function updateButtonStates() {
        const today = getToday();
        const todayData = absenData.filter(a => a.tanggal === today);

        const sudahMasuk = todayData.some(a => a.status === 'masuk');
        const sudahKeluar = todayData.some(a => a.status === 'keluar');
        const sudahOff = todayData.some(a => a.status === 'off' || a.status === 'ps');

        document.getElementById('btn-masuk').classList.toggle('btn-disabled', sudahMasuk || sudahOff);
        document.getElementById('btn-keluar').classList.toggle('btn-disabled', !sudahMasuk || sudahKeluar || sudahOff);
        document.getElementById('btn-off').classList.toggle('btn-disabled', sudahMasuk || sudahOff);
    }

    // ========================================
    // FUNGSI ABSENSI
    // ========================================
    async function absenMasuk() {
        if (!currentLocation) {
            tampilModal('GPS Error', 'Silakan refresh GPS terlebih dahulu!');
            return;
        }

        const today = getToday();
        const todayData = absenData.filter(a => a.tanggal === today);
        if (todayData.some(a => a.status === 'masuk' || a.status === 'off' || a.status === 'ps')) {
            tampilModal('Peringatan', 'Anda sudah melakukan absensi hari ini!');
            return;
        }

        const jam = getNowTime();
        const jamAngka = parseInt(jam.split(':')[0]);
        const isLate = jamAngka >= 8 && jamAngka < 12;

        absenData.push({
            tanggal: today,
            jam: jam,
            status: 'masuk',
            isLate: isLate,
            lokasi: `${currentLocation.lat.toFixed(6)}, ${currentLocation.lng.toFixed(6)}`
        });

        saveAbsensi();
        tampilModal('✅ Check In Berhasil', `Selamat bekerja! ${isLate ? '⚠️ Anda terlambat.' : 'Tepat waktu! 🌟'}`);
        document.getElementById('status-log').innerHTML = `<i class="fas fa-check-circle" style="color:var(--success);"></i> Check in berhasil pukul ${jam}`;
    }

    async function absenKeluar() {
        if (!currentLocation) {
            tampilModal('GPS Error', 'Silakan refresh GPS terlebih dahulu!');
            return;
        }

        const today = getToday();
        const todayData = absenData.filter(a => a.tanggal === today);
        const sudahMasuk = todayData.some(a => a.status === 'masuk');

        if (!sudahMasuk) {
            tampilModal('Peringatan', 'Anda belum check in hari ini!');
            return;
        }

        if (todayData.some(a => a.status === 'keluar')) {
            tampilModal('Peringatan', 'Anda sudah check out hari ini!');
            return;
        }

        if (todayData.some(a => a.status === 'off' || a.status === 'ps')) {
            tampilModal('Peringatan', 'Status Anda sedang OFF, tidak bisa check out!');
            return;
        }

        const jam = getNowTime();
        absenData.push({
            tanggal: today,
            jam: jam,
            status: 'keluar',
            lokasi: `${currentLocation.lat.toFixed(6)}, ${currentLocation.lng.toFixed(6)}`
        });

        saveAbsensi();
        tampilModal('✅ Check Out Berhasil', `Sampai jumpa! Semoga harimu menyenangkan. 😊`);
        document.getElementById('status-log').innerHTML = `<i class="fas fa-check-circle" style="color:var(--success);"></i> Check out berhasil pukul ${jam}`;
    }

    async function absenOff() {
        if (!currentLocation) {
            tampilModal('GPS Error', 'Silakan refresh GPS terlebih dahulu!');
            return;
        }

        const today = getToday();
        const todayData = absenData.filter(a => a.tanggal === today);

        if (todayData.some(a => a.status === 'masuk' || a.status === 'off' || a.status === 'ps')) {
            tampilModal('Peringatan', 'Anda sudah melakukan absensi hari ini!');
            return;
        }

        const jam = getNowTime();
        const pilihan = confirm('Klik OK untuk OFF (Izin), atau Batal untuk PS (Sakit)');
        const status = pilihan ? 'off' : 'ps';
        const label = pilihan ? 'OFF (Izin)' : 'PS (Sakit)';

        absenData.push({
            tanggal: today,
            jam: jam,
            status: status,
            lokasi: `${currentLocation.lat.toFixed(6)}, ${currentLocation.lng.toFixed(6)}`
        });

        saveAbsensi();
        tampilModal(`✅ ${label}`, `Status ${label} tercatat pukul ${jam}`);
        document.getElementById('status-log').innerHTML = `<i class="fas fa-info-circle" style="color:var(--warning);"></i> ${label} pukul ${jam}`;
    }

    // ========================================
    // KEYBOARD SHORTCUT
    // ========================================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') tutupModal();
        if (e.ctrlKey && e.key === 'r') {
            e.preventDefault();
            refreshGPS();
        }
    });

    console.log('🚀 UFO Kebonsari - Absensi System v2.0 loaded!');
    console.log('📌 Shortcut: Ctrl+R = Refresh GPS, ESC = Tutup modal');
    console.log('👤 Akun: admin/admin123, karyawan/123456, yoga/yoga123, doni/doni123');
</script>

</body>
</html>
