<!DOCTYPE html>
<html lang="id" class="dark" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Promotor - Google Sheets DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .app-card { backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col md:flex-row">

    <main class="flex-1 p-4 md:p-10 overflow-y-auto space-y-6 max-w-7xl mx-auto w-full">
        <div class="app-card bg-white dark:bg-slate-900/80 border border-indigo-500/30 p-5 rounded-3xl shadow-xl flex justify-between items-center">
            <div>
                <h2 class="text-xl md:text-2xl font-black">JADWAL PROMOTOR UFO MALANG</h2>
                <p id="cloudStatus" class="text-xs text-amber-500 font-bold mt-1">Menghubungkan ke Google Sheets...</p>
            </div>
            <input type="text" id="inputCariNama" placeholder="Cari nama / brand..." onkeyup="renderTabelPromotor()" class="px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold">
        </div>

        <!-- Form Tambah Brand & Sales -->
        <div class="app-card bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl shadow-xl space-y-4">
            <h3 class="font-black text-sm">➕ Tambah Brand & Sales Baru ke Sheets</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                <input type="text" id="inputBrandBaru" placeholder="Nama Brand (cth: POLYTRON)" class="px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-700 rounded-xl text-xs font-bold uppercase">
                <input type="text" id="inputNamaBaru" placeholder="Nama Sales (cth: BUDI)" class="px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-700 rounded-xl text-xs font-bold uppercase">
                <input type="text" id="inputPiketBaru" placeholder="Piket Toilet (cth: 5, 19)" class="px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-700 rounded-xl text-xs font-bold">
                <button onclick="tambahPromotorBaru()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-xl text-xs shadow-lg">Simpan ke Sheets</button>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="app-card bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 p-4 md:p-6 rounded-3xl shadow-xl">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-center text-xs border-collapse">
                    <thead class="bg-slate-100 dark:bg-slate-950 uppercase font-bold text-[11px] sticky top-0 border-b border-slate-700 z-10">
                        <tr>
                            <th class="py-3 px-3 text-left">Brand</th>
                            <th class="py-3 px-3 text-left">Nama</th>
                            <th class="py-3 px-2">Senin</th>
                            <th class="py-3 px-2">Selasa</th>
                            <th class="py-3 px-2">Rabu</th>
                            <th class="py-3 px-2">Kamis</th>
                            <th class="py-3 px-2">Jum'at</th>
                            <th class="py-3 px-2">Sabtu</th>
                            <th class="py-3 px-2">Minggu</th>
                            <th class="py-3 px-3">Piket Toilet</th>
                            <th class="py-3 px-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPromotorBody" class="divide-y divide-slate-800/60"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const gasWebhookUrl = "https://script.google.com/macros/s/AKfycbxtcTaj4KNCykH-f3k88cIlsvVWicigtHJWt0D0u-EzDGkUEIYeQAd1oToJyhgaCdr3IQ/exec";
        let daftarPromotor = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadDataDariSheets();
        });

        async function loadDataDariSheets() {
            const statusEl = document.getElementById('cloudStatus');
            try {
                let response = await fetch(gasWebhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ aksi: "get_promotor" })
                });
                let result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    daftarPromotor = result.data;
                    statusEl.innerText = "Terhubung ke Google Sheets ✓";
                    statusEl.className = "text-xs text-emerald-500 font-bold mt-1";
                    renderTabelPromotor();
                }
            } catch (err) {
                statusEl.innerText = "Gagal memuat Google Sheets (Cek URL Web App)";
                console.error(err);
            }
        }

        async function simpanDataKeSheets() {
            const statusEl = document.getElementById('cloudStatus');
            statusEl.innerText = "Menyimpan ke Google Sheets...";
            try {
                await fetch(gasWebhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ aksi: "simpan_promotor", list: daftarPromotor })
                });
                statusEl.innerText = "Data tersimpan di Google Sheets ✓";
            } catch (err) {
                statusEl.innerText = "Gagal menyimpan ke Sheets!";
            }
        }

        async function tambahPromotorBaru() {
            const brand = document.getElementById('inputBrandBaru').value.trim().toUpperCase();
            const nama = document.getElementById('inputNamaBaru').value.trim().toUpperCase();
            const piket = document.getElementById('inputPiketBaru').value.trim();

            if (!brand || !nama) {
                alert("Isi Nama Brand dan Nama Sales!");
                return;
            }

            daftarPromotor.push({
                brand: brand,
                nama: nama,
                jadwal: ["P", "P", "P", "OFF", "S", "P", "S"],
                piket: piket || "-",
                warnaBrand: "bg-indigo-600 text-white"
            });

            document.getElementById('inputBrandBaru').value = "";
            document.getElementById('inputNamaBaru').value = "";
            document.getElementById('inputPiketBaru').value = "";

            renderTabelPromotor();
            await simpanDataKeSheets();
        }

        async function hapusPromotor(index) {
            if (confirm("Hapus data promotor ini?")) {
                daftarPromotor.splice(index, 1);
                renderTabelPromotor();
                await simpanDataKeSheets();
            }
        }

        function renderTabelPromotor() {
            const tbody = document.getElementById('tabelPromotorBody');
            const keyword = document.getElementById('inputCariNama').value.toLowerCase();
            if(!tbody) return;

            let html = "";
            let filtered = daftarPromotor.map((item, originalIndex) => ({ ...item, originalIndex }))
                .filter(item => item.brand.toLowerCase().includes(keyword) || item.nama.toLowerCase().includes(keyword));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="py-8 text-center text-slate-500">Tidak ada data.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                html += `<tr class="hover:bg-slate-900/40">
                    <td class="py-2.5 px-3 text-left font-bold"><span class="px-2.5 py-1 rounded-lg ${item.warnaBrand} text-[10px]">${item.brand}</span></td>
                    <td class="py-2.5 px-3 text-left font-bold">${item.nama}</td>`;
                
                item.jadwal.forEach(shift => {
                    let badge = "bg-slate-800 text-slate-200";
                    if (shift === "OFF") badge = "bg-rose-500/20 text-rose-400 font-black";
                    else if (shift === "P") badge = "bg-emerald-500/20 text-emerald-300 font-bold";
                    else if (shift === "S") badge = "bg-blue-500/20 text-blue-300 font-bold";
                    html += `<td class="py-2 px-2 text-center"><span class="inline-block w-8 h-8 leading-8 rounded-lg text-xs ${badge}">${shift}</span></td>`;
                });

                html += `<td class="py-2.5 px-3 text-center font-bold text-indigo-400">${item.piket}</td>
                    <td class="py-2.5 px-2 text-center"><button onclick="hapusPromotor(${item.originalIndex})" class="p-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white rounded-lg text-xs">✕</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
